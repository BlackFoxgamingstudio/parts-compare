[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-parts-compare"
version = "1.0.0"
description = "Intelligent wholesale catalog scraper and pricing intelligence engine. Employs anti-bot evasion techniques, normalizes unstructured supplier SKUs, and uses OpenAI embeddings to reconcile ambiguous OEM part numbers across competing distributors."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "web scraping & e-commerce nlp", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-parts-compare = "src.cli:main"
