version: "3.9"
# Sovereign Parts Compare — docker-compose
# Usage: docker-compose up --build

services:
  parts-compare:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-parts-compare:latest
    container_name: sovereign-parts-compare
    restart: unless-stopped
    ports:
      - "8783:8783"
    environment:
      SBB_SCRAPER_CONCURRENCY: ${SBB_SCRAPER_CONCURRENCY}
      SBB_PROXY_LIST: ${SBB_PROXY_LIST}
      SBB_NLP_MODEL: ${SBB_NLP_MODEL}
      SBB_PRICE_ALERT_THRESHOLD: ${SBB_PRICE_ALERT_THRESHOLD}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8783
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8783/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
